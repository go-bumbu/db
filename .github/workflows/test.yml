name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Check coverage
        run: make coverage

  # Postgres in Docker (testcontainers); the hosted Ubuntu runners have Docker.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum

      - name: Run integration tests
        run: make test-integration
